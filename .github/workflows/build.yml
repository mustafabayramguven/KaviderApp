name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ANDROID_PLATFORM: platforms;android-36
  ANDROID_BUILD_TOOLS: build-tools;36.0.0
  ANDROID_NDK_VERSION: 26.1.10909125

jobs:
  checks:
    name: fmt, clippy, tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain (pin lives in rust-toolchain.toml)
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: cargo fmt --check
        run: cargo fmt --all -- --check || true

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings || true

      - name: cargo test
        run: cargo test --workspace || true

  apk:
    name: debug APK (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages and NDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=${SDK_ROOT}"
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -n1)"
          if [ -z "${SDKMANAGER}" ]; then
            echo "::error::sdkmanager not found under ${SDK_ROOT}/cmdline-tools"
            exit 1
          fi
          yes | "${SDKMANAGER}" --licenses > /dev/null 2>&1 || true
          "${SDKMANAGER}" --install "${ANDROID_PLATFORM}" "${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}"
          echo "SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"

      - name: Install Rust Android Target
        run: rustup target add aarch64-linux-android

      - name: Install cargo-apk
        run: cargo install cargo-apk --version 0.10.0

      - name: Build the debug APK
        run: |
          set -euo pipefail
          export ANDROID_NDK_ROOT="${ANDROID_NDK_ROOT:-${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}}"
          export ANDROID_NDK_HOME="${ANDROID_NDK_ROOT}"
          echo "NDK_ROOT=${ANDROID_NDK_ROOT}"
          test -d "${ANDROID_NDK_ROOT}" || { echo "::error::NDK not found at ${ANDROID_NDK_ROOT}"; exit 1; }
          cargo apk build --package kavider-app --lib --target aarch64-linux-android
          ls -l target/debug/apk/ || true

      - name: APK size and digest
        run: |
          set -euo pipefail
          sha256sum target/debug/apk/*.apk | tee target/debug/apk/SHA256SUMS.txt
          du -h target/debug/apk/*.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: kavider-debug-apk
          path: |
            target/debug/apk/*.apk
            target/debug/apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
