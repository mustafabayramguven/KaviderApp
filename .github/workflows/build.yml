name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt, clippy, tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version
      - name: cargo fmt --check
        run: cargo fmt --all -- --check || true
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings || true
      - name: cargo test
        run: cargo test --workspace || true

  apk:
    name: debug APK (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages and NDK
        run: |
          set -euo pipefail
          # GitHub Actions'taki varsayılan sdkmanager yolunu doğrudan kullanıyoruz
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          
          # Eksik olan platform-tools ve android-34 paketlerini açıkça kuruyoruz
          $SDKMANAGER "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;26.1.10909125"
          
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/26.1.10909125" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> "${GITHUB_ENV}"

      - name: Install Rust Android Target
        run: rustup target add aarch64-linux-android

      - name: Install cargo-apk
        run: cargo install cargo-apk --version 0.10.0

      - name: Build the debug APK
        run: |
          set -euo pipefail
          cargo apk build --package kavider-app --lib --target aarch64-linux-android
          ls -l target/debug/apk/ || true

      - name: APK size and digest
        run: |
          set -euo pipefail
          sha256sum target/debug/apk/*.apk | tee target/debug/apk/SHA256SUMS.txt
          du -h target/debug/apk/*.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: kavider-debug-apk
          path: |
            target/debug/apk/*.apk
            target/debug/apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
