name: Kavider Build

on:
  push:
    branches: [ "main" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Slint ve Linux Bağımlılıklarını Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig libfontconfig1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Projeyi Derle (Release Modu)
        run: cargo build --release

      - name: Derlenen Dosyayı GitHub'a Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: kavider-linux-binary
          path: target/release/kavider-app
