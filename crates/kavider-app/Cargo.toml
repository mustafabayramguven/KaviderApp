[package]
name = "kavider-app"
description = "Kavider UI: Slint layout, view-model glue, Android entry point and desktop binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "kavider_app"
# `cdylib` is what becomes the .so inside the APK; `rlib` lets the desktop binary and
# integration tests link the same code.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kavider-app"
path = "src/main.rs"

[dependencies]
kavider-core = { path = "../kavider-core" }

[target.'cfg(target_os = "android")'.dependencies]
# Android: the android-activity backend plus Skia. FemtoVG is disabled by Slint itself on
# Android (it cannot load fonts without fontconfig). See docs/DECISIONS.md D-003.
slint = { workspace = true, default-features = false, features = [
    "std",
    "compat-1-18",
    "renderer-skia",
    "backend-android-activity-06",
] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Desktop: winit + FemtoVG, for fast UI iteration with `cargo run -p kavider-app`.
slint = { workspace = true, default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-winit",
    "renderer-femtovg",
] }

[build-dependencies]
slint-build = { workspace = true }

# ---- Android packaging (cargo-apk 0.10.0 reads this table) -------------------------
[package.metadata.android]
package = "app.kavider.client"
apk_name = "kavider"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
# Debug APKs get a debug keystore generated by cargo-apk; release signing is M5 and uses
# the KEYSTORE_* secrets, never a committed keystore.

[package.metadata.android.sdk]
min_sdk_version = 26
# Android 17 / API 37 is the newest stable line, but Google's repository names its
# platforms `android-37.0/37.1/37.2` and this cargo-apk release predates that scheme, so
# M0 compiles against 36 (which is also the current Play target requirement). See
# docs/DECISIONS.md D-008.
target_sdk_version = 36

[package.metadata.android.application]
label = "Kavider"
debuggable = true

# Only these two permissions, per brief section 7.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"
